# Runs behind the host's Traefik (traefik-a5as), which owns ports 80/443,
# terminates TLS for jarvis.oillie.cloud with its Let's Encrypt resolver and
# forwards to Jplus listening on 0.0.0.0:443 inside this container.
services:
  jarvis:
    build: .
    image: jplus:latest
    container_name: jarvis
    restart: unless-stopped
    init: true                      # reaps the claude subprocesses the brain spawns
    expose:
      - "443"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"   # lets the non-root user bind 443
    environment:
      JARVIS_HOST: 0.0.0.0
      JARVIS_LISTEN_PORT: "443"
      JARVIS_DOMAIN: jarvis.oillie.cloud
      JARVIS_TLS: "off"             # Traefik terminates TLS
    env_file:
      - path: .env                  # FISH_API_KEY etc. - copy Resources/env.example
        required: false
    volumes:
      - jarvis-data:/data           # database, memory, logs, tool token
      - jarvis-home:/home/jarvis    # Claude Code login (~/.claude, ~/.claude.json)
    labels:
      traefik.enable: "true"
      traefik.http.routers.jarvis.rule: Host(`jarvis.oillie.cloud`)
      traefik.http.routers.jarvis.entrypoints: websecure
      traefik.http.routers.jarvis.tls: "true"
      traefik.http.routers.jarvis.tls.certresolver: letsencrypt
      traefik.http.services.jarvis.loadbalancer.server.port: "443"
      traefik.http.services.jarvis.loadbalancer.server.scheme: http

volumes:
  jarvis-data:
  jarvis-home:
